version: '3.8'

services:
  # Private AI Search Engine UI & Retrieval
  private-search:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: private-ai-search
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - SEARXNG_URL=${SEARXNG_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - ollama

  # Optional Local Ollama Service (100% Offline AI)
  ollama:
    image: ollama/ollama:latest
    container_name: private-search-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # If Nvidia GPU is available, uncomment below:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama_models:
    name: private_search_ollama_models
